name: Update Project Cards

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Generate CityJSON MCP card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=Yarroudh&repo=cityjson-mcp&theme=transparent&hide_border=false&border_radius=12
          path: assets/cards/cityjson-mcp.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Literae card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=Yarroudh&repo=Literae&theme=transparent&hide_border=false&border_radius=12
          path: assets/cards/literae.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cards/*.svg
          git commit -m "chore: update project cards" || exit 0
          git push
